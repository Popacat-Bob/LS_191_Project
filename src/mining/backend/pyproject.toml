[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery>=5.7.0",
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "gunicorn>=27.0.0",
    "psycopg[binary]>=3.3.8",
    "redis>=8.1.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "easylv.settings"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "DJ"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
